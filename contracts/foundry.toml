[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
hsk_mainnet = "https://mainnet.hsk.xyz"
hsk_testnet = "https://testnet.hsk.xyz"
local = "http://127.0.0.1:8545"
